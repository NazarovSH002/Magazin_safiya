<div id="view-products" class="view card animate-fadeIn">
    <div class="view-header" style="margin-bottom: 24px;">
        <div>
            <h2 style="margin: 0; font-size: 24px;">Общий список товаров</h2>
            <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Сводная информация по остаткам и
                продажам</p>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
            <button class="btn btn-outline" onclick="window.ProductsModule.exportToCSV()"
                style="padding: 10px 16px; display: flex; align-items: center; gap: 8px;">
                📥 Скачать Excel
            </button>
            <div class="search-box">
                <input type="text" id="productsSearch" placeholder="Поиск товара..."
                    oninput="window.ProductsModule.renderProductsList()">
            </div>
        </div>
    </div>

    <div class="stats-grid"
        style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 32px;">
        <div class="card stat-card">
            <div class="stat-icon" style="background: rgba(139, 92, 246, 0.1); color: var(--accent);">🏷️</div>
            <div class="stat-info">
                <div class="stat-label">Всего позиций</div>
                <div class="stat-value" id="stats-total-names">0</div>
            </div>
        </div>
        <div class="card stat-card">
            <div class="stat-icon" style="background: rgba(59, 130, 246, 0.1); color: #3b82f6;">📦</div>
            <div class="stat-info">
                <div class="stat-label">Штук на складе</div>
                <div class="stat-value" id="stats-total-warehouse">0</div>
            </div>
        </div>
        <div class="card stat-card">
            <div class="stat-icon" style="background: rgba(245, 158, 11, 0.1); color: #f59e0b;">🏪</div>
            <div class="stat-info">
                <div class="stat-label">Штук в магазине</div>
                <div class="stat-value" id="stats-total-shop">0</div>
            </div>
        </div>
        <div class="card stat-card">
            <div class="stat-icon" style="background: rgba(16, 185, 129, 0.1); color: var(--success);">🛒</div>
            <div class="stat-info">
                <div class="stat-label">Всего продано</div>
                <div class="stat-value" id="stats-total-sold">0</div>
            </div>
        </div>
    </div>

    <div id="products-grid"
        style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
        <!-- Карточки товаров будут здесь -->
    </div>
</div>
