<div id="view-shop" class="view">
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="font-size: 18px; font-weight: 700;">🏪 Товар в магазине</h3>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-outline btn-sm" onclick="window.StockModule.downloadShopCSV()">💾 Скачать CSV</button>
                <button class="btn btn-primary btn-sm" onclick="printReport('shop')">🖨️ Печать</button>
            </div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3>Наличие в магазине (торговый зал)</h3>
            <div class="search-box" style="width: 300px; margin-bottom: 0;">
                <input type="text" id="shopSearch" placeholder="Поиск по магазину..." oninput="renderShopInventory()">
            </div>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th onclick="window.StockModule.setShopSort('name')" style="cursor:pointer">Название товара ↕️</th>
                        <th onclick="window.StockModule.setShopSort('qty')" style="cursor:pointer">В магазине ↕️</th>
                        <th onclick="window.StockModule.setShopSort('cost')" style="cursor:pointer">Себестоимость ↕️</th>
                        <th onclick="window.StockModule.setShopSort('date')" style="cursor:pointer">Дата перемещения ↕️</th>
                        <th style="width: 100px;"></th>
                    </tr>
                </thead>
                <tbody id="shop-inventory-tbody"></tbody>
            </table>
        </div>
    </div>
</div>
